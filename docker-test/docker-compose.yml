services:
  # ── MySQL ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: jsdb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: jsdbproof
      MYSQL_DATABASE: jsdb_proof
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: jsdb-mongodb
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: jsdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: jsdbproof
      POSTGRES_DB: jsdb_proof
    ports:
      - "5435:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  mongo_data:
  pg_data:
